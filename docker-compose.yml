# Loadline local stack. `docker compose up` starts the database, runs the
# one-shot migrate step (roles, migrations, seed) and then the app and the
# simulator. Copy .env.example to .env first; nothing else is needed.
#
# On Apple Silicon the official postgis/postgis:18-3.6 image is amd64 only and
# runs under emulation. Build a native one with `pnpm db:image` and set
# POSTGIS_IMAGE=loadline/postgis:18-3.6 in .env. See docs/decisions.

name: loadline

x-db-image: &db-image ${POSTGIS_IMAGE:-postgis/postgis:18-3.6}

services:
  db:
    image: *db-image
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      POSTGRES_DB: ${DB_NAME:-loadline}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql, not .../data.
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-loadline}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Throwaway database for the test suite: tmpfs storage, durability off.
  # Start with: docker compose --profile test up -d db-test
  db-test:
    image: *db-image
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      POSTGRES_DB: loadline_test
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
               -c max_connections=200 -c shared_buffers=256MB
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loadline_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One shot: creates the roles, applies migrations, loads the city table and
  # seeds the two demo companies. Idempotent, so it is safe on every start.
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      DATABASE_URL_SUPER: postgres://postgres:${POSTGRES_PASSWORD:-postgres-local}@db:5432/${DB_NAME:-loadline}
      DATABASE_URL_OWNER: postgres://loadline_owner:${LOADLINE_OWNER_PASSWORD:-owner-local}@db:5432/${DB_NAME:-loadline}
      DATABASE_URL_APP: postgres://loadline_app:${LOADLINE_APP_PASSWORD:-app-local}@db:5432/${DB_NAME:-loadline}
      DATABASE_URL_AUTH: postgres://loadline_auth:${LOADLINE_AUTH_PASSWORD:-auth-local}@db:5432/${DB_NAME:-loadline}
      LOADLINE_OWNER_PASSWORD: ${LOADLINE_OWNER_PASSWORD:-owner-local}
      LOADLINE_APP_PASSWORD: ${LOADLINE_APP_PASSWORD:-app-local}
      LOADLINE_AUTH_PASSWORD: ${LOADLINE_AUTH_PASSWORD:-auth-local}
      LOADLINE_STREAM_PASSWORD: ${LOADLINE_STREAM_PASSWORD:-stream-local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-loadline-demo}

  # The app: one long-lived Node process (the event stream needs it).
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL_APP: postgres://loadline_app:${LOADLINE_APP_PASSWORD:-app-local}@db:5432/${DB_NAME:-loadline}
      DATABASE_URL_AUTH: postgres://loadline_auth:${LOADLINE_AUTH_PASSWORD:-auth-local}@db:5432/${DB_NAME:-loadline}
      DATABASE_URL_STREAM: postgres://loadline_stream:${LOADLINE_STREAM_PASSWORD:-stream-local}@db:5432/${DB_NAME:-loadline}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-this-is-a-local-dev-secret-0123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:-sim-local-token-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIGN_IN_RATE_LIMIT: ${SIGN_IN_RATE_LIMIT:-20}
      TRUST_PROXY: ${TRUST_PROXY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/sign-in'').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Moves the seeded trucks toward their stops and posts positions to the app.
  simulator:
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      SIMULATOR_TARGET_URL: http://web:3000
      SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:-sim-local-token-change-me}
      SIMULATOR_SPEED_FACTOR: ${SIMULATOR_SPEED_FACTOR:-60}
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-3000}
    restart: unless-stopped

volumes:
  dbdata:
